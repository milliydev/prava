<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>pravauchun.uz — boshqaruv paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<script>try{var t=localStorage.getItem('yolchi_theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="/"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="47" fill="none" stroke="#3557F5" stroke-width="13"/><path class="chk" d="M34 62 L52 80 L84 42" fill="none" stroke="#FF7A1A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg><span>prava<b>uchun</b><i>.uz</i></span><em>boshqaruv</em></a>
    <nav class="mainnav"></nav>
    <button class="themebtn hidden" id="logoutBtn" style="width:auto;padding:0 14px">Chiqish</button>
  </div>
  <div class="lane"></div>
</header>
<main class="wrap" id="app">
  <section id="login" class="hidden" style="max-width:380px;padding-top:50px">
    <h1 style="font-size:28px;margin-bottom:18px">Kirish</h1>
    <form id="loginForm" class="field">
      <label for="pw">Administrator paroli</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" style="margin-top:10px">Kirish</button>
      <p id="loginErr" style="color:var(--red)"></p>
    </form>
  </section>

  <div id="tabs" class="chips hidden" style="margin-top:22px"><button class="chip on" data-tab="panel">Savollar</button><button class="chip" data-tab="instrPanel">Instruktorlar</button></div>
  <section id="instrPanel" class="hidden">
    <div class="page-head"><h1>Instruktorlar</h1><p class="muted">Bu yerda qo'shilgan instruktorlar saytdagi "Instruktorlar" bo'limida ko'rinadi. Instruktorning ma'lumotlarini e'lon qilishdan oldin uning roziligini oling.</p></div>
    <div class="admin-tools"><button class="btn" id="addInstr">Instruktor qo'shish</button></div>
    <div class="table-wrap"><table><thead><tr><th></th><th>Ism</th><th>Jinsi</th><th>Tajriba</th><th>Narx</th><th>Telefon</th><th>Holat</th><th></th></tr></thead><tbody id="instrRows"></tbody></table></div>
  </section>
  <section id="panel" class="hidden">
    <div class="page-head"><h1>Savollar</h1><p id="statsLine" class="muted"></p></div>
    <div class="admin-tools">
      <input id="search" type="search" placeholder="Savol, javob yoki izoh bo'yicha qidirish">
      <select id="topicFilter"><option value="">Barcha mavzular</option></select>
      <select id="verFilter"><option value="">Barchasi</option><option value="0">Tekshirilmagan</option><option value="1">Tekshirilgan</option></select>
    </div>
    <div class="admin-tools">
      <button class="btn" id="addBtn">Savol qo'shish</button>
      <button class="btn secondary" id="importBtn">JSON import</button>
      <button class="btn secondary" id="exportBtn">JSON eksport</button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden">
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>№</th><th>Savol</th><th>Mavzu</th><th>Holat</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="nav" id="pager"></div>
  </section>
</main>

<dialog id="editDlg">
  <form id="editForm" method="dialog">
    <h2 id="dlgTitle" style="font-size:20px">Savol</h2>
    <div class="field"><label for="fTopic">Mavzu</label><select id="fTopic" required></select></div>
    <div class="field"><label for="fQuestion">Savol matni</label><textarea id="fQuestion" required></textarea></div>
    <div class="field"><label>Javob variantlari (to'g'risini belgilang)</label><div id="fOptions" style="display:grid;gap:8px"></div>
      <button type="button" class="ghost" id="addOpt" style="justify-self:start">Variant qo'shish</button></div>
    <div class="field"><label for="fExpl">Izoh</label><textarea id="fExpl"></textarea></div>
    <div class="field"><label for="fImage">Rasm</label>
      <select id="fImage"></select>
      <input type="file" id="fUpload" accept="image/png,image/jpeg,image/webp,image/gif">
      <div id="fPreview" class="qimg hidden"></div></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fVerified"> YHQ matni bilan tekshirildi</label>
    <p id="formErr" style="color:var(--red);margin:0"></p>
    <div class="nav"><button type="button" class="btn secondary" id="cancelBtn">Bekor qilish</button><button class="btn" id="saveBtn" value="save">Saqlash</button></div>
  </form>
</dialog>
<dialog id="instrDlg"><form id="instrForm" method="dialog">
  <h2 id="instrTitle" style="font-size:20px">Instruktor</h2>
  <div class="field"><label for="iName">Ism familiya</label><input id="iName" required></div>
  <div class="field"><label for="iGender">Jinsi</label><select id="iGender"><option value="erkak">Erkak</option><option value="ayol">Ayol</option></select></div>
  <div class="field"><label for="iExp">Tajribasi (yil)</label><input id="iExp" type="number" min="0" value="1"></div>
  <div class="field"><label for="iCar">Mashinasi</label><input id="iCar" placeholder="Masalan: Chevrolet Cobalt"></div>
  <div class="field"><label for="iPhone">Telefon</label><input id="iPhone" placeholder="974093040" required></div>
  <div class="field"><label for="iTg">Telegram (username)</label><input id="iTg" placeholder="@username"></div>
  <div class="field"><label for="iSch">Bo'sh vaqtlari</label><input id="iSch" placeholder="Du–Sha, 08:00–18:00"></div>
  <div class="field"><label for="iPrice">Bitta dars narxi (so'm)</label><input id="iPrice" type="number" min="0" step="1000" value="200000"></div>
  <div class="field"><label for="iCity">Shahar / tuman</label><input id="iCity" placeholder="Toshkent, Chilonzor"></div>
  <div class="field"><label for="iPhoto">Rasm (dumaloq qilib ko'rsatiladi)</label><input id="iPhoto" type="file" accept="image/png,image/jpeg,image/webp"><img id="iPrev" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;display:none"></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="iActive" checked> Saytda ko'rsatish</label>
  <p id="iErr" style="color:var(--red);margin:0"></p>
  <div class="nav"><button type="button" class="btn secondary" id="iCancel">Bekor qilish</button><button class="btn">Saqlash</button></div>
</form></dialog>
<script src="/assets/signs.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
